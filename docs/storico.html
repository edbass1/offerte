<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Storico Offerte</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>Monitor <span>Offerte</span></h1>
      <nav><a href="index.html">Offerte</a><a class="on" href="storico.html">Storico</a></nav>
      <div class="upd">Ultimo aggiornamento: <b id="upd">…</b></div>
    </div>
    <div class="ctrl"><input id="hq" placeholder="Filtra storico…"></div>
  </div>
</header>
<main class="wrap">
  <h2 class="cat">Storico variazioni e promo</h2>
  <div class="news-box"><table>
    <thead><tr><th>Data</th><th>Tipo</th><th>Servizio</th><th>Dettaglio</th><th>Fonte</th></tr></thead>
    <tbody id="h"></tbody>
  </table></div>
  <h2 class="cat">Stato fonti ultimo controllo</h2>
  <div class="news-box"><table>
    <thead><tr><th>Servizio</th><th>Esito</th><th>Prezzi</th><th>URL</th></tr></thead>
    <tbody id="s"></tbody>
  </table></div>
</main>
<footer>Lo storico è append-only: ogni cambiamento rilevato viene conservato.</footer>
<script src="app.js"></script>
</body>
</html>
