name: Aggiorna offerte
on:
  schedule: [{cron: "17 * * * *"}]
  workflow_dispatch:
  push: {branches: [main], paths: ["docs/**","config/**","scripts/**"]}
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: offerte, cancel-in-progress: false}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4
      - run: python scripts/update.py
      - name: Commit
        run: |
          git config user.name "offerte-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet || git commit -m "Aggiornamento automatico $(TZ=Europe/Rome date '+%Y-%m-%d %H:%M')"
          git pull --rebase -X theirs origin main || true
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs}
      - id: deployment
        uses: actions/deploy-pages@v4
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
